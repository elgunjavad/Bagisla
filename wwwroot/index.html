<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Bağışlayarsanmı?</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: sans-serif;
    background: #ffd6e8;
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    background: #fff0f6;
    border-radius: 20px;
    padding: 48px 56px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(214,51,108,0.15);
    position: relative;
    min-width: 300px;
  }
  h1 {
    color: #d6336c;
    font-size: 28px;
    margin-bottom: 30px;
  }
  .buttons {
    position: relative;
    height: 130px;
  }
  button {
    padding: 14px 32px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 600;
    position: absolute;
    left: 50%;
  }
  #yes-btn {
    background: #d6336c;
    color: white;
    box-shadow: 0 4px 14px rgba(214,51,108,0.4);
    transition: transform 0.15s;
    top: 0;
    transform: translateX(-50%);
  }
  #yes-btn:hover {
    background: #b32a5a;
  }
  #no-btn {
    background: #fcc2d7;
    color: #842a52;
    transition: background 0.2s;
    bottom: 0;
    transform: translateX(-50%);
  }
  #no-btn:hover {
    background: #f7a8c4;
  }
  #result {
    margin-top: 24px;
    font-size: 20px;
    color: #d6336c;
    min-height: 28px;
    font-weight: 600;
  }
  .heart {
    position: absolute;
    pointer-events: none;
    font-size: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Məni bağışlayarsanmı? 🌸</h1>
    <div class="buttons">
      <button id="yes-btn" onclick="answer(true)">Hə</button>
      <button id="no-btn" onclick="answer(false)">Yox</button>
    </div>
    <div id="result"></div>
  </div>

<script>
const noBtn = document.getElementById('no-btn');
const yesBtn = document.getElementById('yes-btn');
const card = document.querySelector('.card');
const result = document.getElementById('result');

let pulse = setInterval(() => {
  yesBtn.style.transform = 'translateX(-50%) scale(1.08)';
  setTimeout(() => { yesBtn.style.transform = 'translateX(-50%) scale(1)'; }, 300);
}, 1400);

function moveNoButton() {
  const cardRect = card.getBoundingClientRect();
  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;

  const maxX = cardRect.width - btnWidth - 20;
  const maxY = cardRect.height - btnHeight - 20;

  const yesRect = yesBtn.getBoundingClientRect();
  let tries = 0, randomX, randomY;

  do {
    randomX = Math.random() * maxX;
    randomY = Math.random() * maxY;
    tries++;
  } while (
    tries < 20 &&
    Math.abs(randomX - (yesRect.left - cardRect.left)) < btnWidth + 10 &&
    Math.abs(randomY - (yesRect.top - cardRect.top)) < btnHeight + 10
  );

  noBtn.style.left = randomX + 'px';
  noBtn.style.top = randomY + 'px';
  noBtn.style.transform = 'none';
  noBtn.style.bottom = 'auto';
}

noBtn.addEventListener('mouseenter', moveNoButton);
noBtn.addEventListener('touchstart', function(e) {
  e.preventDefault();
  moveNoButton();
});

function spawnHearts() {
  for (let i = 0; i < 14; i++) {
    const h = document.createElement('div');
    h.textContent = '💗';
    h.className = 'heart';
    h.style.left = (40 + Math.random() * 220) + 'px';
    h.style.top = '60px';
    h.style.fontSize = (14 + Math.random() * 10) + 'px';
    h.style.transition = 'all 1.2s ease-out';
    card.appendChild(h);
    requestAnimationFrame(() => {
      h.style.top = (-40 - Math.random() * 60) + 'px';
      h.style.opacity = '0';
      h.style.transform = 'translateX(' + (Math.random() * 60 - 30) + 'px)';
    });
    setTimeout(() => h.remove(), 1300);
  }
}

function answer(isYes) {
  if (isYes) {
    clearInterval(pulse);
    yesBtn.style.transform = 'translateX(-50%) scale(1.1)';
    result.textContent = "Ayallasan, bilirəm yalandan vurdun. Barışmaq istəsən, yaz :( Səni sevirəm 💕";
    spawnHearts();
  }
}
</script>
</body>
</html>
