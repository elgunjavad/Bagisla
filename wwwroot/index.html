<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Bağışlayarsanmı?</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: sans-serif;
    background: #ffd6e8;
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    background: #fff0f6;
    border-radius: 16px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    position: relative;
  }
  h1 {
    color: #d6336c;
    font-size: 28px;
    margin-bottom: 30px;
  }
  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    position: relative;
    height: 60px;
  }
  button {
    padding: 12px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #yes-btn {
    background: #d6336c;
    color: white;
  }
  #yes-btn:hover {
    background: #b32a5a;
  }
  #no-btn {
    background: #fcc2d7;
    color: #842a52;
    position: absolute;
  }
  #result {
    margin-top: 24px;
    font-size: 20px;
    color: #d6336c;
    min-height: 28px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Məni bağışlayarsan? 🌸</h1>
    <div class="buttons">
      <button id="yes-btn" onclick="answer(true)">Hə</button>
      <button id="no-btn" onclick="answer(false)">Yox (basma bu düyməyə) </button>
    </div>
    <div id="result"></div>
  </div>

<script>
const noBtn = document.getElementById('no-btn');
const card = document.querySelector('.card');

function moveNoButton() {
  const cardRect = card.getBoundingClientRect();
  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;

  const maxX = cardRect.width - btnWidth - 10;
  const maxY = cardRect.height - btnHeight - 10;

  const randomX = Math.random() * maxX;
  const randomY = Math.random() * maxY;

  noBtn.style.left = randomX + 'px';
  noBtn.style.top = randomY + 'px';
}

noBtn.addEventListener('mouseenter', moveNoButton);
noBtn.addEventListener('touchstart', function(e) {
  e.preventDefault();
  moveNoButton();
});

function answer(isYes) {
  const result = document.getElementById('result');
  if (isYes) {
    result.textContent = "Ayallasan. Yalandan vurdun bilirəm. Barışmaq istəsən, yaz :( 💕";
  }
}
</script>
</body>
</html>
